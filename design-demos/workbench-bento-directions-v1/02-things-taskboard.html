  <div id="root"></div>
  <script type="text/babel">
    const iosFrameStyles={wrapper:{display:'inline-block',padding:12,background:'#000',borderRadius:60,boxShadow:'0 0 0 2px #1f2937, 0 20px 60px rgba(0,0,0,0.3)',position:'relative'},screen:{position:'relative',borderRadius:48,overflow:'hidden',background:'#fff'},statusBar:{position:'absolute',top:0,left:0,right:0,height:54,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'0 32px',fontSize:16,fontWeight:600,fontFamily:'-apple-system, "SF Pro Text", sans-serif',zIndex:20,pointerEvents:'none'},dynamicIsland:{position:'absolute',top:12,left:'50%',transform:'translateX(-50%)',width:124,height:36,background:'#000',borderRadius:999,zIndex:30},statusIcons:{display:'flex',alignItems:'center',gap:6},signalIcon:{display:'flex',alignItems:'flex-end',gap:2,height:12},signalBar:{width:3,background:'currentColor',borderRadius:1},batteryIcon:{width:26,height:12,border:'1.5px solid currentColor',borderRadius:3,padding:1,position:'relative',opacity:.8},batteryCap:{position:'absolute',top:3,right:-3,width:2,height:6,background:'currentColor',borderRadius:'0 1px 1px 0'},content:{position:'absolute',top:54,left:0,right:0,bottom:34,overflow:'auto'},homeIndicator:{position:'absolute',bottom:10,left:'50%',transform:'translateX(-50%)',width:140,height:5,background:'rgba(0,0,0,.3)',borderRadius:999,zIndex:10},homeIndicatorDark:{background:'rgba(255,255,255,.5)'}};
    function IosFrame({children,width=393,height=852,time='9:41',battery=100,darkMode=false,showStatusBar=true,showDynamicIsland=true,showHomeIndicator=true}){const textColor=darkMode?'#fff':'#000';return <div style={iosFrameStyles.wrapper}><div style={{...iosFrameStyles.screen,width,height,background:darkMode?'#000':'#fff'}}>{showStatusBar&&<div style={{...iosFrameStyles.statusBar,color:textColor}}><span>{time}</span><div style={iosFrameStyles.statusIcons}><div style={iosFrameStyles.signalIcon}>{[4,6,9,11].map(h=><div key={h} style={{...iosFrameStyles.signalBar,height:h}}/>)}</div><svg width="16" height="12" viewBox="0 0 16 12" fill="none" style={{color:textColor}}><path d="M8 11.5a1 1 0 100-2 1 1 0 000 2z" fill="currentColor"/><path d="M3 7.5a7 7 0 0110 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round"/><path d="M1 4.5a11 11 0 0114 0" stroke="currentColor" strokeWidth="1.3" fill="none" strokeLinecap="round" opacity=".7"/></svg><div style={iosFrameStyles.batteryIcon}><div style={{width:`${battery}%`,height:'100%',background:'currentColor',borderRadius:1,opacity:.9}}/><div style={iosFrameStyles.batteryCap}/></div></div></div>}{showDynamicIsland&&<div style={iosFrameStyles.dynamicIsland}/>}<div style={iosFrameStyles.content}>{children}</div>{showHomeIndicator&&<div style={{...iosFrameStyles.homeIndicator,...(darkMode?iosFrameStyles.homeIndicatorDark:{})}}/>}</div></div>}
    const Icon=({name,size=20})=>{const common={width:size,height:size,viewBox:'0 0 24 24',fill:'none',stroke:'currentColor',strokeWidth:'1.9',strokeLinecap:'round',strokeLinejoin:'round'};const paths={pin:<><path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1116 0z"/><circle cx="12" cy="10" r="2.5"/></>,bell:<><path d="M18 8a6 6 0 00-12 0c0 7-3 7-3 7h18s-3 0-3-7"/><path d="M10 19h4"/></>,home:<><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></>,order:<><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h5"/></>,user:<><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></>,shield:<><path d="M12 3l7 3v5c0 5-3.3 8.2-7 10-3.7-1.8-7-5-7-10V6z"/><path d="M9 12l2 2 4-5"/></>,bag:<><rect x="4" y="7" width="16" height="13" rx="4"/><path d="M8 7a4 4 0 018 0M8 12h8"/></>,clock:<><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,arrow:<><path d="M5 12h14M14 7l5 5-5 5"/></>};return React.createElement('svg',common,paths[name])};
    function App(){const[online,setOnline]=React.useState(true);const[toast,setToast]=React.useState('');const notify=t=>{setToast(t);setTimeout(()=>setToast(''),1300)};return <div className="presentation"><div className="caption"><small>Direction 02 · Calm Taskboard</small><h1>清晰任务板</h1><p>来源：优秀任务管理产品的扫描效率与安静秩序；用白色、细分隔线和单一品牌青降低视觉噪声。</p></div><IosFrame time="9:41" battery={86}><main className="app"><div className="scroll"><header className="profile"><div className="avatar">悦</div><div className="identity"><strong>悦小米<span className="verified">已认证</span></strong><p>ID 4234545 · 当前等级 V1</p></div><button className="bell" onClick={()=>notify('进入消息中心')}><Icon name="bell"/></button></header><section className="status-card"><div className="status-row"><div className="status-mark"><Icon name="pin" size={22}/></div><div className="status-copy"><strong>{online?'在线接单中':'已暂停接单'}</strong><span>{online?'当前可接收附近的新订单':'开启后即可接收新订单'}</span></div><button className={'toggle '+(online?'':'off')} aria-label="切换在线状态" onClick={()=>setOnline(!online)}><i/></button></div><div className="location"><span><Icon name="pin" size={14}/>使用最近位置 · 刚刚更新</span><span>昆明</span></div></section><div className="section-head"><strong>本月经营</strong><span>数据更新于刚刚</span></div><section className="business"><div className="metric-row"><div className="metric"><span>本月收入</span><b>¥22,123</b></div><div className="metric"><span>本月订单</span><b>24<small>单</small></b></div><div className="metric"><span>服务小时</span><b>46<small>小时</small></b></div></div><div className="chart">{[1,2,3,4,5,6,7].map(i=><i key={i}/>)}</div></section><div className="section-head"><strong>下一单</strong><span>今天</span></div><section className="next"><div className="next-top"><strong>15:00–17:00</strong><span>距开始 2 小时</span></div><div className="task"><div className="task-check"><Icon name="bag" size={21}/></div><div className="task-copy"><b>旅游陪伴 · 张女士</b><p>2 小时 · 订单号 091415</p></div><button onClick={()=>notify('查看下一单详情')}><Icon name="arrow" size={18}/></button></div><div className="next-meta"><span><Icon name="pin" size={14}/>昆明老街正门</span><span><Icon name="clock" size={14}/>提前 10 分钟到达</span></div></section><section className="queue" onClick={()=>notify('查看待处理订单')}><div className="queue-icon"><Icon name="order" size={18}/></div><div className="queue-copy"><b>待处理事项</b><span>3 个新订单等待确认 · 0 条未读消息</span></div><span className="badge">3</span></section></div><button className="alarm" aria-label="紧急报警" onClick={()=>notify('长按发起紧急报警')}><Icon name="shield" size={22}/></button><nav className="tabbar"><button className="tab active"><Icon name="home"/>首页</button><button className="tab" onClick={()=>notify('切换到订单')}><Icon name="order"/>订单</button><button className="tab" onClick={()=>notify('切换到我的')}><Icon name="user"/>我的</button></nav><div className={'toast '+(toast?'show':'')}>{toast}</div></main></IosFrame></div>}
    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
